<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibLens - Library Visualizer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #1a1b2e;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 340px;
      min-width: 280px;
      background: #16162e;
      border-right: 1px solid #2a2d5a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #2a2d5a;
      background: linear-gradient(135deg, #1e1f42, #16162e);
    }

    .sidebar-header h1 {
      font-size: 22px;
      color: #7aa2f7;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1::before { content: '\uD83D\uDD0D'; font-size: 20px; }

    .version {
      font-size: 11px;
      color: #545c7e;
      display: block;
      margin-top: 4px;
    }

    /* Scan button */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
    }

    .section { padding: 16px 20px; border-bottom: 1px solid #2a2d5a; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #545c7e;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .btn-scan {
      width: calc(100% - 40px);
      margin: 0 20px 8px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #7aa2f7, #3d6ef8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-scan:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(61, 110, 248, 0.3); }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress */
    .progress-bar-bg {
      width: calc(100% - 40px);
      margin: 0 20px;
      height: 4px;
      background: #2a2d5a;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fg {
      height: 100%;
      background: linear-gradient(90deg, #7aa2f7, #3d6ef8);
      transition: width 0.3s;
      border-radius: 2px;
    }

    .progress-text {
      margin: 8px 20px;
      font-size: 12px;
      color: #7aa2f7;
      text-align: center;
    }

    /* Stats bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: calc(100% - 40px);
      margin: 0 20px;
    }

    .stat-item {
      background: #1e1f42;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .stat-item .count {
      font-size: 18px;
      font-weight: 700;
      color: #7aa2f7;
    }

    .stat-item .label {
      font-size: 9px;
      text-transform: uppercase;
      color: #545c7e;
      letter-spacing: 0.5px;
    }

    /* Search */
    .search-input {
      width: calc(100% - 40px);
      margin: 0 20px;
      padding: 10px 14px;
      background: #1e1f42;
      border: 1px solid #2a2d5a;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: #7aa2f7; }

    /* Package list */
    .package-list { flex: 1; overflow-y: auto; padding: 8px 10px; }

    .category-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #545c7e;
      margin: 12px 6px 6px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-header:first-child { margin-top: 4px; }

    .category-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .nodejs-dot { background: #E3DDAA; }
    .python-dot { background: #56B4BD; }
    .ruby-dot { background: #CC6699; }
    .brew-dot { background: #FFD6A1; }
    .system-dot { background: #C9CBFF; }

    .package-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 10px;
    }

    .package-item:hover { background: #1e1f42; }
    .package-item.selected { background: #2a2d5a; border-left: 3px solid #7aa2f7; }

    .pkg-name {
      font-size: 13px;
      color: #c9d1d9;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pkg-version {
      font-size: 11px;
      color: #545c7e;
      background: #1a1b3a;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Main area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Command bar */
    .command-bar {
      padding: 12px 20px;
      border-bottom: 1px solid #2a2d5a;
      background: #16162e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .command-placeholder {
      color: #545c7e;
      font-size: 13px;
      margin-right: -4px;
    }

    .command-input {
      flex: 1;
      padding: 10px 14px;
      background: #1e1f42;
      border: 1px solid #2a2d5a;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      font-family: 'SF Mono', Monaco, monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .command-input:focus { border-color: #7aa2f7; }

    .btn-run {
      padding: 10px 20px;
      background: linear-gradient(135deg, #7ee787, #3d6ef8);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-run:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61, 110, 248, 0.3); }

    /* Output area */
    .output-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-msg {
      text-align: center;
    }

    .welcome-msg h2 { color: #7aa2f7; margin-bottom: 12px; font-size: 20px; }
    .welcome-msg p { color: #545c7e; font-size: 13px; line-height: 1.8; }

    .output-output {
      width: 100%;
      background: #12122a;
      border: 1px solid #2a2d5a;
      border-radius: 8px;
      padding: 16px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      color: #c9d1d9;
      line-height: 1.7;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .output-output.error { color: #f7768e; border-color: #f7768e33; }

    /* Detail panel */
    .detail-panel {
      background: #12122a;
      border-top: 1px solid #2a2d5a;
      padding: 14px 20px;
      display: none;
    }

    .detail-panel.active { display: block; }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .detail-name { font-size: 15px; color: #7aa2f7; font-weight: 600; }

    .detail-close {
      background: none;
      border: none;
      color: #545c7e;
      cursor: pointer;
      font-size: 18px;
      padding: 2px 8px;
    }

    .detail-close:hover { color: #c9d1d9; }

    .detail-rows {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
    }

    .detail-row { font-size: 12px; }
    .detail-label { color: #545c7e; }
    .detail-value { color: #c9d1d9; display: block; margin-top: 1px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d5a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3f6e; }

    /* Filters */
    .filters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

    .filter-chip {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid #2a2d5a;
      background: transparent;
      color: #7aa2f7;
      transition: all 0.15s;
    }

    .filter-chip:hover { background: #1e1f42; }
    .filter-chip.active { background: #7aa2f7; color: white; border-color: #7aa2f7; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>LibLens</h1>
      <span class="version">Library Visualizer v1.0</span>
    </div>

    <div class="sidebar-body">
      <button class="btn-scan" id="btn-scan" style="margin-top: 16px;">\uD83D\uDD0D Scan Libraries</button>

      <div class="progress-bar-bg" id="prog-bg" style="display:none;">
        <div class="progress-bar-fg" id="prog-fg" style="width: 0%"></div>
      </div>
      <div class="progress-text hidden" id="prog-text" style="display:none;"></div>

      <div class="section">
        <div class="section-title">Overview</div>
        <div class="stats-grid" id="stats-grid" style="display:none;">
          <div class="stat-item"><span class="count" id="stat-total">0</span><span class="label">Total</span></div>
          <div class="stat-item"><span class="count" id="stat-pypi">0</span><span class="label">Python</span></div>
          <div class="stat-item"><span class="count" id="stat-npm">0</span><span class="label">Node.js</span></div>
          <div class="stat-item"><span class="count" id="stat-brew">0</span><span class="label">Homebrew</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Search Packages</div>
        <input type="text" class="search-input" id="search-input" placeholder="Type to filter...">
        <div class="filters" id="filters">
          <button class="filter-chip active" data-cat="all">All</button>
          <button class="filter-chip" data-cat="python">Python</button>
          <button class="filter-chip" data-cat="nodejs">Node.js</button>
          <button class="filter-chip" data-cat="brew">Homebrew</button>
        </div>
      </div>

      <div style="flex:1;overflow-y:auto;">
        <div class="package-list" id="package-list"></div>
      </div>
    </div>
  </div>

  <div class="main-area">
    <div class="command-bar">
      <span class="command-placeholder">$</span>
      <input type="text" class="command-input" id="cmd-input" placeholder="Try: pip show pandas, npm root -g, conda list | grep numpy, brew list --versions node...">
      <button class="btn-run" id="run-cmd">Run</button>
    </div>

    <div class="detail-panel hidden" id="detail-panel">
      <div class="detail-header">
        <span class="detail-name" id="detail-name"></span>
        <button class="detail-close" id="close-detail">&times;</button>
      </div>
      <div class="detail-rows" id="detail-content"></div>
    </div>

    <div class="output-area" id="output-area">
      <div class="welcome-msg">
        <h2>Welcome to LibLens</h2>
        <p>
          Click <strong>"Scan Libraries"</strong> to detect your installed packages<br>
          Or run commands above: <code style="color:#7aa2f7">pip show pandas</code>, <code style="color:#7aa2f7">npm root -g</code>, <code style="color:#7aa2f7">conda list</code>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
